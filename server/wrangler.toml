name = "monadverse-arena"
main = "src/index.js"
compatibility_date = "2024-09-23"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "CHRONICLE"
class_name = "Chronicle"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Chronicle"]   # SQLite-backed Durable Objects work on the Workers free plan

[vars]
# Chronicle holder checks read the real Chog Genesis contract on Monad (read-only). Staking stays off until ARENA/RPC/CHAIN_ID are set.
CHOG = "0xc96d31F8626c6D03Fae5dCD3d61e3FB9F4a73763"
CHOG_RPC = "https://rpc.monad.xyz"
