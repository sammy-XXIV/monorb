<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chog #1462 3D</title>
<style>
  html,body{margin:0;height:100%;background:#29c5d6;font-family:"Space Grotesk",system-ui,sans-serif;overflow:hidden}
  canvas{display:block}
  #panel{position:fixed;top:16px;left:16px;background:#1b1530ee;color:#fff;border:2px solid #000;border-radius:10px;padding:14px 16px;font-size:13px;line-height:1.7;min-width:190px}
  #panel h1{margin:0 0 6px;font-size:16px}
  #panel b{color:#9d8cff;font-weight:600}
  #hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#1b1530ee;color:#fff;border:2px solid #000;border-radius:999px;padding:8px 16px;font-size:13px;white-space:nowrap}
  button{font:inherit;background:#8b6cff;color:#fff;border:2px solid #000;border-radius:8px;padding:5px 10px;cursor:pointer;margin:8px 6px 0 0}
</style>
</head>
<body>
<div id="panel"><h1>CHOG #1462</h1><div id="traits"></div><button id="spin">Auto-rotate: on</button><button id="tr">Traits: on</button></div>
<div id="hint">Drag to orbit 360° · scroll to zoom · right-drag to pan</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// Token #1462 metadata (tokenURI on 0xc96d…3763, Monad)
const TRAITS = {Background:"Deep Aqua",Base:"Origin",Skin:"Pink",Side:"Left",Body:"Yellow 143 Jersey",Mouth:"Flat",Eyes:"BTC Glass",Head:"MCGA",Accessory:"Fwog",Form:"Chog",Tier:"Uncommon",Naked:"No"};
document.getElementById("traits").innerHTML = Object.entries(TRAITS).map(([k,v])=>`<b>${k}</b> ${v}`).join("<br>");

const C = {cream:0xf6efd2, pink:0xe0509a, purple:0x5b36b8, spikeD:0x3f2390, spikeL:0x6c45cf, yellow:0xf6d98a, orange:0xf39a1e, purpleCap:0x8a4dff, purpleCapD:0x5a2bb0, green:0x2fa83a, ink:0x0d0d0d, white:0xffffff};

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x29c5d6);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 1.5, 8.5);
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0); controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 2.2;
controls.minDistance = 3; controls.maxDistance = 16;
document.getElementById("spin").onclick = e => { controls.autoRotate = !controls.autoRotate; e.target.textContent = "Auto-rotate: " + (controls.autoRotate ? "on" : "off"); };

scene.add(new THREE.HemisphereLight(0xffffff, 0x6aa0c0, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(3,6,5); scene.add(sun);

const tex = (w,h,draw) => { const c=document.createElement("canvas"); c.width=w; c.height=h; draw(c.getContext("2d"),w,h); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; };
const toon = c => new THREE.MeshToonMaterial({color:c});
const flat = c => new THREE.MeshBasicMaterial({color:c});
const V = (x,y,z) => new THREE.Vector3(x,y,z);

// solid + black back-face shell = cartoon outline
function add(parent, geo, mat, pos=[0,0,0], scale=[1,1,1], rot=[0,0,0], outline=true){
  const m = new THREE.Mesh(geo, mat); m.position.set(...pos); m.scale.set(...scale); m.rotation.set(...rot); parent.add(m);
  if (outline) { const o = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color:C.ink, side:THREE.BackSide})); o.scale.setScalar(1.06); m.add(o); }
  return m;
}
// capsule limb from point a to point b
function limb(parent, a, b, r, mat){
  const len = a.distanceTo(b), m = add(parent, new THREE.CapsuleGeometry(r, Math.max(len-2*r,0.01), 6, 14), mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(V(0,1,0), b.clone().sub(a).normalize());
  return m;
}

const chog = new THREE.Group(); scene.add(chog);

/* ================= BASE CHOG ================= */
const base = new THREE.Group(); chog.add(base);

// torso (purple hoodie) — Body trait recolours it
const torso = add(base, new THREE.CylinderGeometry(0.5,0.62,0.9,32), toon(C.purple), [0,0.3,0]);

// legs + pink feet
for (const s of [-1,1]) {
  limb(base, V(s*0.25,0.0,0), V(s*0.28,-0.4,0.15), 0.15, toon(C.purple));
  add(base, new THREE.SphereGeometry(0.2,20,12), toon(C.pink), [s*0.28,-0.5,0.3], [1,0.45,1.3]);
}
// arm resting on hip (viewer's right) + pink hand
limb(base, V(0.5,0.6,0.05), V(0.78,0.28,0.35), 0.14, toon(C.purple));
add(base, new THREE.SphereGeometry(0.17,20,14), toon(C.pink), [0.8,0.25,0.38]);
// raised arm (viewer's left) + pink hand
limb(base, V(-0.5,0.6,0.05), V(-0.95,0.9,0.7), 0.14, toon(C.purple));
const hand = add(base, new THREE.SphereGeometry(0.19,20,14), toon(C.pink), [-0.98,0.95,0.75]);

// head
const head = new THREE.Group(); head.position.set(0,1.55,0); base.add(head);
add(head, new THREE.SphereGeometry(1.0,40,28), toon(C.purple), [0,0,-0.05], [1.12,1.0,1.0]); // hair mass
// spikes fanned over the back, top and sides (kept as a list so the cap can hide the top ones)
const spikes = [];
const N = 34;
for (let i=0;i<N;i++){
  const y = 1 - (i+0.5)/N*1.85, r = Math.sqrt(1-y*y), th = i*Math.PI*(3-Math.sqrt(5));
  const d = V(Math.cos(th)*r*1.15, y*0.95, Math.sin(th)*r).normalize();
  if (d.z > 0.35 && d.y < 0.75) continue; // keep the face clear
  const big = 0.75 + 0.45*((i*37)%7)/7;
  const sp = add(head, new THREE.ConeGeometry(0.3,big,6), toon(i%3 ? C.spikeD : C.spikeL), [0,0,0], [1,1,1], [0,0,0]);
  sp.position.copy(d).multiplyScalar(0.95 + big*0.35);
  sp.quaternion.setFromUnitVectors(V(0,1,0), d);
  sp.userData.dir = d; spikes.push(sp);
}
// face: cream mask
add(head, new THREE.SphereGeometry(1,40,28), toon(C.cream), [0,-0.12,0.62], [0.82,0.7,0.5]);
// eyes (big glossy anime eyes)
const eyes = new THREE.Group(); head.add(eyes);
for (const s of [-1,1]) {
  add(eyes, new THREE.SphereGeometry(0.2,24,16), flat(C.white), [s*0.33,-0.02,1.02], [1,1.2,0.5]);
  add(eyes, new THREE.SphereGeometry(0.14,24,16), flat(C.ink), [s*0.33+0.0,-0.03,1.07], [1,1.2,0.4], [0,0,0], false);
  add(eyes, new THREE.SphereGeometry(0.045,12,8), flat(C.white), [s*0.33+0.05,0.05,1.11], [1,1,0.4], [0,0,0], false);
}
// cheeks + nose
for (const s of [-1,1]) add(head, new THREE.CircleGeometry(0.13,24), flat(C.pink), [s*0.6,-0.3,0.95], [1,0.8,1], [0,s*0.5,0], false);
add(head, new THREE.ConeGeometry(0.07,0.1,3), toon(C.pink), [0,-0.22,1.07], [1,1,0.6], [Math.PI,0,0], false);
// default smile (hidden when the Mouth trait replaces it)
const smile = new THREE.Mesh(new THREE.TorusGeometry(0.18,0.02,8,24,Math.PI), flat(C.ink)); smile.position.set(0,-0.34,1.04); smile.rotation.z = Math.PI; smile.scale.z=0.5; head.add(smile);

/* ================= TRAIT OVERLAYS ================= */
const overlays = new THREE.Group(); chog.add(overlays);
const trait = {};                       // name -> {apply(), remove()} so traits stay swappable
function T(name, on, off){ trait[name] = {on, off}; }

// Body: Yellow 143 Jersey
const jersey = new THREE.Group(); overlays.add(jersey); jersey.visible=false;
const num = tex(256,256,(g,w,h)=>{ g.fillStyle="#1a1a1a"; g.font="bold 150px Arial"; g.textAlign="center"; g.textBaseline="middle"; g.fillText("143",w/2,h/2); });
const numPlane = new THREE.Mesh(new THREE.PlaneGeometry(0.42,0.42), new THREE.MeshBasicMaterial({map:num,transparent:true})); numPlane.position.set(0,0.25,0.58); jersey.add(numPlane);
T("Body", ()=>{ torso.material.color.setHex(C.yellow); jersey.visible=true; }, ()=>{ torso.material.color.setHex(C.purple); jersey.visible=false; });

// Eyes: BTC Glass
const glasses = new THREE.Group(); head.add(glasses); glasses.visible=false;
const btc = tex(256,256,(g,w,h)=>{ g.fillStyle="#f39a1e"; g.fillRect(0,0,w,h); g.fillStyle="#fff"; g.font="bold 190px Arial"; g.textAlign="center"; g.textBaseline="middle"; g.fillText("B",w/2,h/2+8); g.fillRect(w*0.4,h*0.12,w*0.05,h*0.14); g.fillRect(w*0.55,h*0.12,w*0.05,h*0.14); g.fillRect(w*0.4,h*0.76,w*0.05,h*0.14); g.fillRect(w*0.55,h*0.76,w*0.05,h*0.14); });
for (const s of [-1,1]) {
  const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,0.1,40), [toon(C.orange), new THREE.MeshBasicMaterial({map:btc}), toon(C.orange)]);
  lens.position.set(s*0.4,-0.02,1.08); lens.rotation.x = Math.PI/2; glasses.add(lens);
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.33,0.33,0.08,40), flat(C.ink)); ring.position.set(s*0.4,-0.02,1.065); ring.rotation.x = Math.PI/2; glasses.add(ring);
  add(glasses, new THREE.CylinderGeometry(0.025,0.025,0.95,8), flat(C.orange), [s*0.85,0.0,0.62], [1,1,1], [Math.PI/2,0,0.0], false);
}
add(glasses, new THREE.CylinderGeometry(0.025,0.025,0.2,8), flat(C.orange), [0,0.0,1.08], [1,1,1], [0,0,Math.PI/2], false);
T("Eyes", ()=>{ glasses.visible=true; eyes.visible=false; }, ()=>{ glasses.visible=false; eyes.visible=true; });

// Mouth: Flat
const flatMouth = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.04,0.03), flat(C.ink)); flatMouth.position.set(0.05,-0.36,1.05); flatMouth.visible=false; head.add(flatMouth);
T("Mouth", ()=>{ flatMouth.visible=true; smile.visible=false; }, ()=>{ flatMouth.visible=false; smile.visible=true; });

// Head: MCGA cap (hides the spikes it covers)
const cap = new THREE.Group(); cap.position.set(0,0.3,0); cap.rotation.x = -0.1; head.add(cap); cap.visible=false;
const capTex = tex(2048,512,(g,w,h)=>{ g.fillStyle="#8a4dff"; g.fillRect(0,0,w,h); g.fillStyle="#fff"; g.font="bold 78px 'Comic Sans MS',cursive"; g.textAlign="center"; g.textBaseline="middle"; g.fillText("MAKE CHOG",w*0.25,h*0.18); g.fillText("GREAT AGAIN",w*0.25,h*0.36); });
add(cap, new THREE.SphereGeometry(1,48,24,0,Math.PI*2,0,Math.PI/2), new THREE.MeshToonMaterial({map:capTex}), [0,0,0], [1.22,0.95,1.1]);
add(cap, new THREE.CylinderGeometry(1.0,1.0,0.07,48,1,false,-Math.PI*0.5,Math.PI), toon(C.purpleCapD), [0,0.02,0.88], [1.2,1,0.5], [0.05,0,0]);
T("Head", ()=>{ cap.visible=true; spikes.forEach(s=>{ const d=s.userData.dir; s.visible = !(d.y>0.35 && d.z>-0.4); }); }, ()=>{ cap.visible=false; spikes.forEach(s=>s.visible=true); });

// Accessory: Fwog in the raised hand
const fwog = new THREE.Group(); fwog.position.set(-0.98,1.3,0.75); overlays.add(fwog); fwog.visible=false;
add(fwog, new THREE.SphereGeometry(0.3,24,16), toon(C.green), [0,0,0], [1,0.9,0.9]);
for (const s of [-1,1]) { add(fwog, new THREE.SphereGeometry(0.1,16,12), flat(C.white), [s*0.14,0.2,0.12], [1,1,1], [0,0,0], false); add(fwog, new THREE.SphereGeometry(0.045,12,8), flat(C.ink), [s*0.14,0.2,0.21], [1,1,1], [0,0,0], false); }
add(fwog, new THREE.SphereGeometry(0.07,12,8), flat(0xe2506a), [0,-0.08,0.25], [1,0.8,0.5], [0,0,0], false);
T("Accessory", ()=>{ fwog.visible=true; }, ()=>{ fwog.visible=false; });

let on = true;
const apply = v => { for (const k of Object.keys(trait)) trait[k][v?"on":"off"](); };
apply(true);
document.getElementById("tr").onclick = e => { on=!on; apply(on); e.target.textContent = "Traits: " + (on?"on":"off"); };

// ground
const ground = new THREE.Mesh(new THREE.CircleGeometry(2.2,48), new THREE.MeshBasicMaterial({color:0x0a6f7c,transparent:true,opacity:0.55})); ground.rotation.x=-Math.PI/2; ground.position.y=-0.66; scene.add(ground);

addEventListener("resize",()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
(function loop(){ requestAnimationFrame(loop); chog.position.y = Math.sin(performance.now()/700)*0.04; controls.update(); renderer.render(scene,camera); })();
</script>
</body>
</html>
