<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chog Walk 3D</title>
<style>
  html,body{margin:0;height:100%;background:#5b6cf7;font-family:"Space Grotesk",system-ui,sans-serif;overflow:hidden}
  canvas{display:block}
  #panel{position:fixed;top:16px;left:16px;background:#1b1530ee;color:#fff;border:2px solid #000;border-radius:10px;padding:12px 16px;font-size:13px}
  #ref{position:fixed;top:16px;right:16px;width:400px;max-width:45vw;border:2px solid #000;border-radius:10px}
  #hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#1b1530ee;color:#fff;border:2px solid #000;border-radius:999px;padding:8px 16px;font-size:13px;white-space:nowrap}
  button{font:inherit;background:#8b6cff;color:#fff;border:2px solid #000;border-radius:8px;padding:5px 10px;cursor:pointer;margin:6px 6px 0 0}
</style>
</head>
<body>
<div id="panel"><b>STEP 5 · WALK (JOINTS)</b><br><span id="st">loading…</span><br><button id="spin">Auto-rotate: off</button><button id="ink">Outline: on</button></div>
<img id="ref" src="ref.png" alt="Reference: turnaround front, left and back views">
<div id="hint">Drag to orbit 360° · scroll to zoom</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const scene = new THREE.Scene(); scene.background = new THREE.Color(0x5b6cf7);
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100); const az = parseFloat(new URLSearchParams(location.search).get("az") || 0) * Math.PI / 180;
const el = parseFloat(new URLSearchParams(location.search).get("el") || 0) * Math.PI / 180;
camera.position.set(Math.sin(az) * Math.cos(el) * 17, -0.4 + Math.sin(el) * 17, Math.cos(az) * Math.cos(el) * 17);
const renderer = new THREE.WebGLRenderer({antialias: true}); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight); renderer.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0, -0.4, 0); controls.enableDamping = true; controls.autoRotate = false; controls.autoRotateSpeed = 2;
let inkOn = true;    // outline: silhouette + part boundaries, constant width
document.getElementById("spin").onclick = e => { controls.autoRotate = !controls.autoRotate; e.target.textContent = "Auto-rotate: " + (controls.autoRotate ? "on" : "off"); };
document.getElementById("ink").onclick = e => { inkOn = !inkOn; e.target.textContent = "Outline: " + (inkOn ? "on" : "off"); };

scene.add(new THREE.AmbientLight(0xffffff, 2.6));
const sun = new THREE.DirectionalLight(0xffffff, 0.6);   // soft, low contrast: the drawing is near-flat colour sun.position.set(2, 4, 4); scene.add(sun);
// two crisp tones (lit / shadow), like the flat-shaded drawing
const tones = new THREE.DataTexture(new Uint8Array([120, 255]), 2, 1, THREE.RedFormat);
tones.minFilter = tones.magFilter = THREE.NearestFilter; tones.needsUpdate = true;

const chog = new THREE.Group(); scene.add(chog);
const shells = [], parts = []; let partId = 1;   // each mesh gets its own ID colour; lines go where the ID changes
const normalMat = new THREE.MeshNormalMaterial(), flatNormal = new THREE.MeshBasicMaterial({color: 0xff0000});   // pure red never occurs as a real normal -> marks face pixels
const loader = new GLTFLoader(); let n = 0;
for (const file of ["../face/face.glb", "../hair/hair.glb", "body_rig.glb"]) loader.load(file, g => {
  const meshes = []; g.scene.traverse(o => o.isMesh && meshes.push(o));   // collect first: adding outlines mid-traverse recurses forever
  meshes.forEach(m => {
    const tex = m.material.map;
    if (m.name.startsWith("ink")) { m.visible = false; return; }   // traced spike strokes: removed (looked like scratches)
    // face drawn slightly toward the camera so the hair's outline shell can't poke through it
    m.material = tex ? new THREE.MeshBasicMaterial({map: tex, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -8}) : new THREE.MeshLambertMaterial({color: m.material.color});
    m.userData.inkMat = (tex || file.includes("hair")) ? flatNormal : normalMat;   // ink lines on the body only (head stays clean)
    const pid = (m.name.startsWith("leg") || m.name.startsWith("torso")) ? 99 : partId++;                       // legs share the torso's ID: no line across the hips
    m.userData.idMat = new THREE.MeshBasicMaterial({color: new THREE.Color().setRGB((pid * 37 % 251) / 255, 0.5, 0.5, THREE.LinearSRGBColorSpace),
      side: m.material.side, polygonOffset: m.material.polygonOffset, polygonOffsetFactor: m.material.polygonOffsetFactor, polygonOffsetUnits: m.material.polygonOffsetUnits});   // same depth rules as the colour pass
    parts.push(m);
  });
  chog.add(g.scene); if (++n === 3) rig(); document.getElementById("st").textContent = n + "/3 parts loaded";
}, undefined, e => document.getElementById("st").textContent = "load failed: " + e.message);

// ---- ink lines: screen-space edges from a normal + depth pass (folds, overlapping spikes, nose) ----
const size = new THREE.Vector2();
const rtColor = new THREE.WebGLRenderTarget(1, 1, {samples: 4});
const rtNormal = new THREE.WebGLRenderTarget(1, 1); rtNormal.depthTexture = new THREE.DepthTexture(1, 1);
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const inkMat = new THREE.ShaderMaterial({
  uniforms: {tColor: {value: rtColor.texture}, tNormal: {value: rtNormal.texture}, px: {value: new THREE.Vector2()}, W: {value: 1.0}},
  vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }",
  fragmentShader: `
    uniform sampler2D tColor, tNormal; uniform vec2 px; uniform float W; varying vec2 vUv;
    void main(){
      vec4 col = texture2D(tColor, vUv); float id0 = texture2D(tNormal, vUv).r; float hit = 0.0, n = 0.0;
      for (int i = 0; i < 16; i++) {                       // ring of samples at radius W: constant line width on screen
        float a = float(i) * 0.3927; vec2 o = vec2(cos(a), sin(a)) * px * W;
        hit += step(0.002, abs(texture2D(tNormal, vUv + o).r - id0)); n += 1.0;
      }
      float e = smoothstep(0.0, 0.35, hit / n);
      gl_FragColor = vec4(mix(col.rgb, vec3(0.006), e), 1.0);
      #include <colorspace_fragment>
    }`
});
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), inkMat); const quadScene = new THREE.Scene(); quadScene.add(quad);
function resize(){
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
  renderer.getDrawingBufferSize(size); rtColor.setSize(size.x, size.y); rtNormal.setSize(size.x, size.y);
  rtNormal.depthTexture.image.width = size.x; rtNormal.depthTexture.image.height = size.y; inkMat.uniforms.px.value.set(1 / size.x, 1 / size.y); inkMat.uniforms.W.value = 1.1 * renderer.getPixelRatio();
}
addEventListener("resize", resize); resize();
// ---- walk rig: hip / shoulder pivots, legs and arms swing in opposite phase, body bobs, walks a circle ----
const ground = new THREE.Mesh(new THREE.CircleGeometry(7, 64), new THREE.MeshBasicMaterial({color: 0x4a5be6}));
ground.rotation.x = -Math.PI / 2; ground.position.y = -2.36; scene.add(ground);
const shadow = new THREE.Mesh(new THREE.CircleGeometry(1.0, 32), new THREE.MeshBasicMaterial({color: 0x3343c0}));
shadow.rotation.x = -Math.PI / 2; shadow.scale.set(1, 0.55, 1); scene.add(shadow);
const bones = {}, rest = {}; const qx = new THREE.Quaternion(), X = new THREE.Vector3(1, 0, 0);
function rig(){                                   // skeleton comes from body_rig.glb: just find the bones and keep their rest pose
  chog.traverse(o => { if (o.isBone) { bones[o.name] = o; rest[o.name] = o.quaternion.clone(); } });
}
function bend(name, ang){ const b = bones[name]; if (!b) return; b.quaternion.copy(rest[name]).multiply(qx.setFromAxisAngle(X, ang)); }
const R_WALK = 3.6, SPEED = 0.35;                 // circle radius, laps per ~18 s
let walking = !location.search.includes("still");
const camOff = new THREE.Vector3(); let camInit = false;
// gaits: cadence, thigh swing, knee fold, arm swing, elbow bend, lean, bounce, laps speed
const GAITS = {
  walk: {cad: 6.0,  thigh: 0.55, knee: 0.9, arm: 0.5,  elbow: 0.35, elbowX: 0.3, lean: 0.08, bob: 0.12, speed: 0.35},
  run:  {cad: 11.0, thigh: 0.95, knee: 1.6, arm: 0.85, elbow: 1.45, elbowX: 0.1, lean: 0.28, bob: 0.22, speed: 0.9},
};
let gait = location.search.includes("run") ? "run" : "walk", G = {...GAITS[gait]}, dist = 0, phase = 0, lastT = null;
const gb = document.createElement("button"); gb.textContent = "Mode: " + gait; document.getElementById("panel").appendChild(gb);
gb.onclick = () => { gait = gait === "walk" ? "run" : "walk"; gb.textContent = "Mode: " + gait; };
function animate(t){
  if (!walking) return;
  const dt = lastT === null ? 0 : Math.min(0.05, t - lastT); lastT = t;
  for (const k in G) G[k] += (GAITS[gait][k] - G[k]) * Math.min(1, dt * 5);   // blend smoothly between walk and run
  const frozen = new URLSearchParams(location.search).get("time") !== null;
  phase = frozen ? t * G.cad : phase + dt * G.cad; dist = frozen ? t * G.speed : dist + dt * G.speed;
  const ph = phase, sw = Math.sin(ph);
  const SIGN = parseFloat(new URLSearchParams(location.search).get("s") || 1);
  for (const [s, k] of [["L", 1], ["R", -1]]) {
    const leg = sw * k, lift = Math.max(0, Math.cos(ph) * k);            // lift: the leg that is swinging forward
    bend("thigh_" + s, SIGN * G.thigh * leg);
    bend("shin_" + s, -SIGN * (0.15 + G.knee * lift));                  // knee folds while the leg swings through
    bend("upperarm_" + s, -SIGN * G.arm * leg);
    bend("forearm_" + s, -SIGN * (G.elbow + G.elbowX * Math.max(0, -leg)));
  }
  const a = dist;
  chog.position.set(Math.cos(a) * R_WALK, Math.abs(Math.cos(ph)) * G.bob, Math.sin(a) * R_WALK);   // bounce twice per stride
  chog.rotation.set(G.lean, -a, 0, "YXZ");        // face along the circle, lean into the motion
  shadow.position.set(chog.position.x, -2.35, chog.position.z);
  // follow camera at his front-right 3/4, so the stride reads
  const fwd = new THREE.Vector3(Math.sin(-a), 0, Math.cos(-a)), right = new THREE.Vector3(fwd.z, 0, -fwd.x);
  const fixed = location.search.includes("side") || location.search.includes("front");   // debug cameras stay locked
  if (fixed || !camInit) {
    if (location.search.includes("side")) { camOff.copy(right).multiplyScalar(14); camOff.y = 0.5; }
    else if (location.search.includes("front")) { camOff.copy(fwd).multiplyScalar(14); camOff.y = 1.0; }
    else { camOff.copy(fwd).multiplyScalar(9).addScaledVector(right, 11); camOff.y = 3.5; }
    controls.target.set(chog.position.x, -0.6, chog.position.z); camera.position.copy(controls.target).add(camOff); camInit = true;
  } else {                                        // follow: carry the camera along with him, keep the angle you orbited to
    const d = new THREE.Vector3(chog.position.x, -0.6, chog.position.z).sub(controls.target);
    controls.target.add(d); camera.position.add(d);
  }
}
(function loop(){
  requestAnimationFrame(loop); controls.update(); const T0 = new URLSearchParams(location.search).get("time"); animate(T0 !== null ? parseFloat(T0) : performance.now() / 1000);   // ?time=… freezes a pose
  if (!inkOn) { renderer.setRenderTarget(null); renderer.render(scene, camera); return; }
  renderer.setRenderTarget(rtColor); renderer.render(scene, camera);
  const bg = scene.background; scene.background = null;
  parts.forEach(m => { m.userData.mat = m.material; m.material = m.userData.idMat; }); ground.visible = shadow.visible = false;   // floor is not outlined
  renderer.setRenderTarget(rtNormal); renderer.setClearColor(0x000000, 1); renderer.clear(); renderer.render(scene, camera);
  parts.forEach(m => m.material = m.userData.mat); scene.background = bg; ground.visible = shadow.visible = true;
  renderer.setRenderTarget(null); renderer.render(quadScene, quadCam);
})();
</script>
</body>
</html>
